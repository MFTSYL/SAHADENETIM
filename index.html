<title>Saha Denetimi</title>
<style>

html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}

button:focus-visible{outline:3px solid var(--ana);outline-offset:2px}
.kap{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:120px}
header{position:sticky;top:0;z-index:5;background:var(--ana);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}

.ust-satir{display:flex;justify-content:space-between;align-items:center;gap:10px}

.alt{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--kart);border-top:1px solid var(--cizgi);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}

.btn{flex:1;min-height:60px;border-radius:14px;font-weight:700;font-size:18px}

.alan{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:14px;margin-bottom:8px;min-height:62px}

.tip.Teknik{background:#E6E3F5;color:#4B3F9A} .tip.Genel{background:#EDEDED;color:#4A4A4A}
/* Kayıt ekranı */
.blok{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-bottom:12px}
.blok-bas{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.blok-bas b{font-size:16px} .blok-bas span{font-size:13px;color:var(--soluk)}
.mik{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px;font-weight:700;background:var(--ana);color:#fff}

@media (prefers-reduced-motion:no-preference){.kayitta .nabiz{animation:nb 1s infinite}@keyframes nb{50%{opacity:.25}}}
.dokum{margin-top:10px;font-size:16px;min-height:0}
.parca{display:flex;gap:8px;align-items:flex-start;background:#F7FAF9;border-radius:10px;padding:10px;margin-top:8px}

.sil{flex:none;min-width:44px;min-height:44px;border-radius:10px;background:var(--kirmizi2);color:var(--kirmizi);font-weight:700;font-size:20px;line-height:1}
.uyari{font-size:14px;background:var(--sari2);color:var(--sari);border-radius:10px;padding:9px 11px;margin-top:8px}

input[type=file]{display:none}
.ayar input{width:100%;min-height:52px;border:1.5px solid var(--cizgi);border-radius:12px;padding:0 12px;font:inherit;margin:6px 0 12px}

.cip.r-Az.secili{background:#2F8F5B;border-color:#2F8F5B}

.cip.e-Bireysel.secili{background:#2F8F5B;border-color:#2F8F5B}

.cipler{display:flex;flex-wrap:wrap;gap:8px}
.deger-blok .blok-bas b{font-size:15px}
.arama{width:100%;min-height:48px;border:1.5px solid var(--cizgi);border-radius:12px;padding:0 14px;font:inherit;background:#fff;margin-bottom:10px}
.filtreler{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:0 -2px;scrollbar-width:none}
.filtre{flex:none;padding:8px 13px;border-radius:20px;background:#fff;border:1.5px solid var(--cizgi);font-size:14px;font-weight:600;color:var(--soluk)}

.kayit-kart{display:flex;width:100%;text-align:left;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;margin-bottom:10px;overflow:hidden}
.kayit-kart .omurga{width:7px;flex:none}
.kayit-kart .ic2{flex:1;min-width:0;padding:11px 13px;display:block}
.ust2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ust2 b{font-size:16px}.ust2 span{font-size:12px;color:var(--soluk);white-space:nowrap}
.alt2{display:block;font-size:13px;color:var(--soluk);margin-top:1px}
.goz2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin:5px 0 7px}
.etiketler2{display:flex;flex-wrap:wrap;gap:5px}
.et2{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--ana2);color:var(--ana)}
.et2.soluk{background:#F0F0F0;color:#777}
.durum-Açık{background:#DCE8F7!important;color:#1F3864!important}.durum-DÖFaçıldı{background:#F9D2A8!important;color:#6B3A00!important}
.durum-Kapatıldı{background:#D3EBD9!important;color:#1E5E33!important}.durum-Değerlendirmede{background:#FBE3B0!important;color:#6B4A00!important}
.rapor .r-kapak{background:var(--ana);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.r-ust{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r-id{font:12px ui-monospace,Menlo,monospace;opacity:.8}
.r-kapak h2{margin:10px 0 2px;font-size:22px;line-height:1.25}.r-kapak p{margin:0;opacity:.9;font-size:14px}.r-kapak .r-meta{margin-top:8px;font-size:13px;opacity:.8}
.r-alarm{background:var(--kirmizi2);color:var(--kirmizi);font-weight:700;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.r-blok{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-bottom:12px}
.r-blok h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soluk)}.r-blok h3 small{font-weight:400}
.r-gozlem{margin:0;font-size:17px;line-height:1.5}
.r-konum{margin:10px 0 0;font-size:14px;background:#F7FAF9;border-radius:10px;padding:8px 10px}.r-konum span{display:block;font-size:12px;color:var(--soluk)}
.r-fotolar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r-fotolar.tek{grid-template-columns:1fr}
.r-fotolar img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#E4EAE8;cursor:zoom-in}
.r-fotolar img:not(.hazir){animation:bekle 1.2s infinite}
@keyframes bekle{50%{opacity:.5}}
.r-ciplar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.r-cip{background:#F7FAF9;border-radius:10px;padding:8px;text-align:center}.r-cip span{display:block;font-size:12px;color:var(--soluk)}.r-cip b{font-size:15px}
.r-satir{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #EEF2F0;font-size:15px}.r-satir span{color:var(--soluk)}.r-satir b{text-align:right}
.r-not{margin:8px 0 0;font-size:14px;background:var(--sari2);border-radius:10px;padding:8px 10px}
.r-sistem .r-satir{font-size:13px}
.tamekran{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center}
.tamekran img{max-width:100%;max-height:100%;object-fit:contain}
.sayac2,.ipucu2{position:absolute;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#eee;padding:4px 12px;border-radius:14px;font-size:13px}
.sayac2{top:calc(12px + env(safe-area-inset-top))}.ipucu2{bottom:calc(16px + env(safe-area-inset-bottom))}
.adimlar{display:flex;gap:6px;margin:2px 0 10px}
.adimlar span{flex:1;text-align:center;font-size:13px;font-weight:600;padding:7px 4px;border-radius:20px;background:#fff;border:1px solid var(--cizgi);color:var(--soluk)}
.adimlar span.aktif{background:var(--ana);border-color:var(--ana);color:#fff}
.adimlar span.bitti{background:var(--ana2);border-color:var(--ana2);color:var(--ana)}
.adim-baslik{font-size:21px;margin:4px 4px 0}
.icerik>.ipucu{margin:2px 4px 12px}
.secim{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:var(--kart);border:1.5px solid var(--cizgi);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:64px}
.secim .kutu{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--cizgi);display:flex;align-items:center;justify-content:center;color:#fff}
.secim .kutu svg{width:20px;height:20px}
.secim .metin{flex:1;min-width:0}.secim .metin b{display:block;font-size:16px}.secim .metin span{display:block;font-size:13px;color:var(--soluk);margin-top:2px}
.secim.on{border-color:var(--ana);background:var(--ana2)}
.secim.on .kutu{background:var(--ana);border-color:var(--ana)}
.deger-alt{font-size:13px;color:var(--soluk);font-weight:600;margin:12px 0 6px}
.deger-blok .deger-alt:first-of-type{margin-top:0}
.kapsam{margin:10px 12px 0;font-size:14px;background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:8px 12px;color:var(--ink)}
.kameraEkran{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.kameraEkran video{flex:1;width:100%;object-fit:cover;min-height:0}
.kameraAlt{display:flex;align-items:center;justify-content:space-between;padding:18px 22px calc(22px + env(safe-area-inset-bottom));background:#000}
.kameraAlt button{color:#fff;font-weight:700;min-width:84px;min-height:56px;border-radius:12px;background:rgba(255,255,255,.14)}
.deklansor{width:78px;height:78px;min-width:78px!important;border-radius:50%!important;background:#fff!important;border:5px solid rgba(255,255,255,.45);background-clip:padding-box!important}
.flas{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:31;transition:opacity .15s}
.kameraSayac{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700}
.durumSatir{font-size:13px;color:var(--soluk);margin-top:8px}
</style></head>
<body><div id="app"></div>
<input type="file" id="kamera" accept="image/*" capture="environment">
<input type="file" id="galeri" accept="image/*" multiple>
<script>
"use strict";
// ---------- Ayarlar ----------
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)) };
(function linktenKur(){
  const p=new URLSearchParams(location.search);
  if(p.get('api')&&p.get('token')){ LS.set('api',p.get('api')); LS.set('token',p.get('token')); history.replaceState(null,'',location.pathname); }
})();
const ayar=()=>({api:LS.get('api',''),token:LS.get('token',''),denetci:LS.get('denetci',''),sesSakla:LS.get('sesSakla',true)});

// ---------- IndexedDB kuyruğu ----------
const DB={ ac(){return new Promise((res,rej)=>{const r=indexedDB.open('saha-denetimi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kuyruk',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async islem(mod,fn){const db=await this.ac();return new Promise((res,rej)=>{const tx=db.transaction('kuyruk',mod);const st=tx.objectStore('kuyruk');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});},
  koy(k){return this.islem('readwrite',s=>s.put(k));}, sil(id){return this.islem('readwrite',s=>s.delete(id));}, hepsi(){return this.islem('readonly',s=>s.getAll());} };

// ---------- Durum ----------
let ekran='ana', aktif=null, alanlar=LS.get('alanlar',[]).filter(a=>a&&a.servis), secim={kat:new Set(),servis:new Set(),bolum:new Set()}, gecmis=LS.get('gecmis',[]), kuyrukSayisi=0, gonderiliyor=false, mesaj='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yerelGun=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const saat=()=>new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const MIK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';
const GAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
const KAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>';

// ---------- Ses: tanıma + dosya ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ANDROID=/Android/i.test(navigator.userAgent);
// Android'de mikrofon aynı anda hem ses kaydına hem metne çevirmeye verilemiyor: varsayılan metin
const sesDosyasiAcik=()=>ayar().sesSakla && !(ANDROID && SR);
let kayit=null;
async function sesBaslat(hedef){
  if(kayit) await sesDurdur();
  const k={hedef,metin:'',ara:'',durdu:false,parcalar:[],baslangic:Date.now(),sonuc:0};
  kayit=k; aktif.uyari='';
  try{ if('wakeLock' in navigator) k.kilit=await navigator.wakeLock.request('screen'); }catch(e){}
  if(sesDosyasiAcik() && navigator.mediaDevices && window.MediaRecorder){
    try{
      k.akis=await navigator.mediaDevices.getUserMedia({audio:true});
      const tip=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
      k.recorder=new MediaRecorder(k.akis,tip?{mimeType:tip,audioBitsPerSecond:32000}:undefined);
      k.recorder.ondataavailable=e=>{if(e.data.size)k.parcalar.push(e.data)};
      k.recorder.start(1000);
    }catch(e){ aktif.uyari='Ses dosyası kaydedilemedi (mikrofon izni?).'; }
  }
  if(SR){
    const yeni=()=>{
      const t=new SR(); t.lang='tr-TR'; t.continuous=false; t.interimResults=true; t.maxAlternatives=1;
      t.onresult=ev=>{ let ara=''; for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];
          if(r.isFinal){ const m=r[0].transcript.trim(); if(m){k.metin+=(k.metin?' ':'')+m; k.sonuc++;} } else ara+=r[0].transcript; }
        k.ara=ara; canliYaz(); };
      t.onerror=ev=>{
        if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){k.durdu=true;aktif.uyari='Metne çevirme izni verilmedi. Tarayıcı ayarlarından mikrofon iznini açın.';ciz();}
        else if(ev.error==='audio-capture'){k.durdu=true;aktif.uyari='Mikrofon metne çevirmeye verilemedi. Ayarlar\'da "Ses dosyasını da sakla" kapalı olmalı.';ciz();}
        else if(ev.error==='network'){k.durdu=true;aktif.uyari='Metne çevirme için internet gerekiyor.';ciz();}
        // no-speech ve aborted: onend içinde yeniden başlar
      };
      t.onend=()=>{ if(kayit===k&&!k.durdu){ k.ara&&(k.metin+=(k.metin?' ':'')+k.ara.trim(),k.ara=''); try{ k.tanima=yeni(); k.tanima.start(); }catch(e){} } };
      return t;
    };
    try{ k.tanima=yeni(); k.tanima.start(); }catch(e){ aktif.uyari='Metne çevirme başlatılamadı.'; }
  } else {
    aktif.uyari='Bu tarayıcı metne çevirmeyi desteklemiyor. Android\'de Google Chrome, iPhone\'da Safari ile açın.';
  }
  k.zamanlayici=setTimeout(()=>{ if(kayit===k) sesDurdur().then(ciz); },180000);
  ciz();
}
function canliYaz(){ const el=$('#canli'); if(el&&kayit) el.innerHTML=esc(kayit.metin)+(kayit.ara?` <span class="ara">${esc(kayit.ara)}</span>`:''); }
async function sesDurdur(){
  const k=kayit; if(!k) return; kayit=null; k.durdu=true; clearTimeout(k.zamanlayici);
  try{k.tanima&&k.tanima.stop()}catch(e){}
  if(k.recorder&&k.recorder.state!=='inactive'){ await new Promise(r=>{k.recorder.onstop=r;k.recorder.stop();}); }
  if(k.akis) k.akis.getTracks().forEach(t=>t.stop());
  try{k.kilit&&k.kilit.release()}catch(e){}
  await new Promise(r=>setTimeout(r,350)); // son sonuçların gelmesi için
  const metin=(k.metin+(k.ara?' '+k.ara:'')).trim();
  if(SR && !metin && Date.now()-k.baslangic>2500) aktif.uyari='Konuşma metne çevrilemedi. Telefona yakın ve net konuşup tekrar deneyin; sorun sürerse Google Chrome kullanıldığından emin olun.';
  let ses=null;
  if(k.parcalar.length){ const blob=new Blob(k.parcalar,{type:k.recorder.mimeType||'audio/webm'}); ses={mime:blob.type.split(';')[0],uzanti:blob.type.includes('mp4')?'m4a':'webm',data:await b64(blob),sure:Math.round((Date.now()-k.baslangic)/1000)}; }
  if(!metin&&!ses) return;
  const parca={metin,ses,saat:saat()};
  if(k.hedef==='konum') aktif.konum=parca; else if(k.hedef==='kime') aktif.acilKime=parca.metin; else aktif.gozlem.push(parca);
  taslakSakla();
}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob);});

// ---------- Fotoğraf: sayfa içi kamera veya galeri ----------
function kucult(kaynak,gen,yuk,maks,kalite){ const o=Math.min(1,maks/Math.max(gen,yuk));
  const c=document.createElement('canvas'); c.width=Math.round(gen*o); c.height=Math.round(yuk*o);
  c.getContext('2d').drawImage(kaynak,0,0,c.width,c.height); return c.toDataURL('image/jpeg',kalite).split(',')[1]; }
function fotoKaydet(kaynak,gen,yuk){
  aktif.fotolar.push({mime:'image/jpeg',uzanti:'jpg',data:kucult(kaynak,gen,yuk,1600,0.8),kucuk:kucult(kaynak,gen,yuk,700,0.7),saat:saat()});
  taslakSakla();
}
async function fotoEkle(dosyalar){
  if(!aktif) return; let hata=0;
  for(const dosya of dosyalar){
    try{
      let kaynak,gen,yuk;
      if(window.createImageBitmap){ kaynak=await createImageBitmap(dosya,{imageOrientation:'from-image'}); gen=kaynak.width; yuk=kaynak.height; }
      else { const url=URL.createObjectURL(dosya); kaynak=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;}); gen=kaynak.naturalWidth; yuk=kaynak.naturalHeight; }
      fotoKaydet(kaynak,gen,yuk);
    }catch(e){ hata++; }
  }
  if(hata) aktif.uyari=hata+' fotoğraf okunamadı (biçim desteklenmiyor olabilir).';
  ciz();
}
['kamera','galeri'].forEach(id=>$('#'+id).addEventListener('change',e=>{ const f=[...e.target.files]; e.target.value=''; fotoEkle(f); }));

let kameraAkis=null;
async function kameraAc(){
  if(kayit) await sesDurdur();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $('#kamera').click(); return; }
  try{
    kameraAkis=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(e){ aktif.uyari='Kamera açılamadı (izin?). Galeriden ekleyebilirsiniz.'; ciz(); return; }
  const el=document.createElement('div'); el.className='kameraEkran'; el.id='kameraEkran';
  el.innerHTML=`<video id="vid" autoplay playsinline muted></video><div class="kameraSayac" id="kSayac">${aktif.fotolar.length} fotoğraf</div>
    <div class="kameraAlt"><button id="kKapat">Bitti</button><button class="deklansor" id="kCek" aria-label="Fotoğraf çek"></button><button id="kGaleri">Galeri</button></div><div class="flas" id="flas"></div>`;
  document.body.appendChild(el);
  const v=$('#vid'); v.srcObject=kameraAkis; try{await v.play();}catch(e){}

  $('#kKapat').onclick=kameraKapat;
  $('#kGaleri').onclick=()=>{ kameraKapat(); $('#galeri').click(); };
}
function kameraKapat(){ if(kameraAkis){kameraAkis.getTracks().forEach(t=>t.stop()); kameraAkis=null;} const e=$('#kameraEkran'); if(e) e.remove(); ciz(); }

// ---------- Kayıt yaşam döngüsü ----------
const SEP='\u0001';
const servisAnahtar=a=>[a.kat,a.blok,a.servis].join(SEP);
const bolumAnahtar=a=>[a.kat,a.blok,a.servis,a.bolum].join(SEP);
const tekil=l=>[...new Set(l.filter(Boolean))];
function yeniKayit(sec){
  const servisler=alanlar.filter(a=>sec.servis.has(servisAnahtar(a)));
  const seciliBolumler=servisler.filter(a=>a.bolum&&sec.bolum.has(bolumAnahtar(a)));
  // Bölüm seçilmemiş servisler servis düzeyinde kaydedilir
  const kapsam=[...seciliBolumler, ...servisler.filter(a=>!seciliBolumler.some(b=>servisAnahtar(b)===servisAnahtar(a)))];
  const n=new Date();
  const hms=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join('');
  const katlar=tekil(kapsam.map(a=>a.kat)), servisAdlari=tekil(kapsam.map(a=>a.servis)), bolumAdlari=tekil(seciliBolumler.map(a=>a.bolum));
  aktif={id:'SD-'+yerelGun(n).replace(/-/g,'')+hms+'-'+Math.random().toString(36).slice(2,6),
    tarih:n.toLocaleDateString('tr-TR'),tarihISO:yerelGun(n),acilis:saat(),
    kat:katlar.join('; '),blok:tekil(kapsam.map(a=>a.blok)).join('; '),servis:servisAdlari.join('; '),bolum:bolumAdlari.join('; '),
    alanTipi:tekil(kapsam.map(a=>a.tip)).join('; '),
    baslik:(bolumAdlari.length?bolumAdlari:servisAdlari).slice(0,2).join(', ')+((bolumAdlari.length||servisAdlari.length)>2?' +'+((bolumAdlari.length||servisAdlari.length)-2):''),
    altBaslik:katlar.join(', '),
    konum:null,gozlem:[],fotolar:[],uyari:''};
  aktif.alan=aktif.servis+(aktif.bolum?' — '+aktif.bolum:'');
  const kayitli={kat:[...sec.kat],servis:[...sec.servis],bolum:[...sec.bolum],etiket:aktif.baslik,alt:aktif.altBaslik};
  const son=LS.get('sonSecimler',[]).filter(x=>x.etiket+x.alt!==kayitli.etiket+kayitli.alt); son.unshift(kayitli); LS.set('sonSecimler',son.slice(0,3));
  ekran='kayit'; taslakSakla(); ciz(); window.scrollTo(0,0);
}
function taslakSakla(){ try{LS.set('taslak',aktif)}catch(e){ /* kota dolarsa fotoğraflar yalnız bellekte kalır */ try{LS.set('taslak',{...aktif,fotolar:[]})}catch(_){} } }
async function kaydiKapat(){
  if(kayit) await sesDurdur();
  const s=ayar();
  const paket={id:aktif.id,tarih:aktif.tarih,tarihISO:aktif.tarihISO,acilis:aktif.acilis,kapanis:saat(),denetci:s.denetci,
    kat:aktif.kat,blok:aktif.blok,servis:aktif.servis||aktif.alan,bolum:aktif.bolum||'',alan:aktif.alan,alanTipi:aktif.alanTipi,
    konumDetay:aktif.konum?aktif.konum.metin:'',
    gozlem:aktif.gozlem.map(p=>p.metin).filter(Boolean).join('\n'),
    tip:aktif.tip||'',siklik:aktif.siklik||'',etki:aktif.etki||'',risk:aktif.risk||'',acil:aktif.acil||'',acilKime:aktif.acilKime||'',
    fotolar:aktif.fotolar.map(({mime,uzanti,data,kucuk})=>({mime,uzanti,data,kucuk})),
    sesler:[aktif.konum,...aktif.gozlem].filter(p=>p&&p.ses).map(p=>({mime:p.ses.mime,uzanti:p.ses.uzanti,data:p.ses.data})),
    cihaz:navigator.userAgent.includes('iPhone')?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Bilgisayar'};
  await DB.koy(paket);
  gecmis.unshift({id:paket.id,alan:aktif.baslik||paket.alan,saat:paket.kapanis,ozet:(paket.gozlem||'(metin yok)').slice(0,90),foto:paket.fotolar.length,durum:'bekliyor'});
  LS.set('gecmis',gecmis.slice(0,60)); localStorage.removeItem('taslak');
  aktif=null; ekran='ana'; ciz(); gonder();
}
async function gonder(){
  if(gonderiliyor) return; const s=ayar(); if(!s.api) return;
  gonderiliyor=true;
  try{
    const liste=await DB.hepsi(); kuyrukSayisi=liste.length; ciz();
    for(const p of liste){
      const g=gecmis.find(x=>x.id===p.id);
      try{
        // Google, tarayıcıda birden çok hesap açıkken POST isteğini zaman zaman boş GET'e çevirebiliyor;
        // bu durumda sunucu "Yetkisiz erişim" döner. Birkaç kez yeniden dene.
        let j={};
        for(let deneme=0;deneme<4;deneme++){
          const r=await fetch(s.api,{method:'POST',body:JSON.stringify({token:s.token,action:'kayit',kayit:p})});
          j=await r.json();
          if(j.ok||!/Yetkisiz/i.test(j.hata||'')) break;
          await new Promise(x=>setTimeout(x,1500*(deneme+1)));
        }
        if(!j.ok&&/Yetkisiz/i.test(j.hata||'')){ if(g){g.durum='bekliyor';g.hata='';} LS.set('gecmis',gecmis); break; }
        if(j.ok){ await DB.sil(p.id); if(g){g.durum='ok';g.satir=j.satir;g.islenen=`${j.foto??'?'} foto, ${j.ses??'?'} ses`;} }
        else { if(g){g.durum='hata';g.hata=j.hata;} }
      }catch(e){ if(g){g.durum='bekliyor';} break; } // bağlantı yok: sonra tekrar
      LS.set('gecmis',gecmis); kuyrukSayisi=(await DB.hepsi()).length; ciz();
    }
  } finally { gonderiliyor=false; kuyrukSayisi=(await DB.hepsi()).length; ciz(); }
}
async function alanlariGetir(){
  const s=ayar(); if(!s.api) return;
  try{ const r=await fetch(`${s.api}?action=alanlar&token=${encodeURIComponent(s.token)}`); const j=await r.json();
    if(j.ok&&j.surum>=3){ alanlar=j.alanlar; LS.set('alanlar',alanlar); mesaj=''; }
    else if(j.ok){ mesaj='Sunucu eski sürümde: Apps Script güncellenip yeniden dağıtılmalı.'; }
    else mesaj=j.hata;
  }catch(e){ mesaj=alanlar.length?'Çevrimdışı: kayıtlı alan listesi kullanılıyor.':'Alan listesi alınamadı; bağlantıyı kontrol edin.'; }
  ciz();
}

const TIK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
function adimBas(no,baslik){
  return `<div class="adimlar">${['Kat','Servis','Bölüm'].map((x,i)=>`<span class="${i+1===no?'aktif':i+1<no?'bitti':''}">${i+1}. ${x}</span>`).join('')}</div><h2 class="adim-baslik">${baslik}</h2><p class="ipucu">Birden fazla seçebilirsiniz.</p>`;
}
function secimKarti(anahtar,tur,baslik,alt,rozet){
  const on=secim[tur].has(anahtar);
  return `<button class="secim ${on?'on':''}" data-tur="${tur}" data-k="${esc(anahtar)}" aria-pressed="${on}"><span class="kutu">${on?TIK:''}</span><span class="metin"><b>${esc(baslik)}</b>${alt?`<span>${esc(alt)}</span>`:''}</span>${rozet?`<span class="tip">${esc(rozet)}</span>`:''}</button>`;
}
function secimBagla(){
  document.querySelectorAll('[data-tur]').forEach(b=>b.onclick=()=>{ const t=b.dataset.tur,k=b.dataset.k; secim[t].has(k)?secim[t].delete(k):secim[t].add(k); const y=window.scrollY; ciz(); window.scrollTo(0,y); });
  document.querySelectorAll('[data-hepsi]').forEach(b=>b.onclick=()=>{ const l=JSON.parse(b.dataset.hepsi); const hepsi=l.every(k=>secim.bolum.has(k)); l.forEach(k=>hepsi?secim.bolum.delete(k):secim.bolum.add(k)); const y=window.scrollY; ciz(); window.scrollTo(0,y); });
}
function altCubuk(geriId,ileriId,ileriMetin,aktifMi){
  return `<div class="alt"><div class="ic"><button class="btn sessiz" id="${geriId}">Geri</button><button class="btn birincil" id="${ileriId}" ${aktifMi?'':'disabled'}>${ileriMetin}</button></div></div>`;
}
function listeYok(){
  return !alanlar.length?`<div class="bos"><b>Alan listesi yükleniyor</b>Liste Google Sheets'teki "Alanlar" sayfasından gelir.</div>`:'';
}
function cizKat(){
  const katlar=tekil(alanlar.map(a=>a.kat));
  const son=LS.get('sonSecimler',[]);
  const kartlar=katlar.map(k=>{ const l=alanlar.filter(a=>a.kat===k); const bloklar=tekil(l.map(a=>a.blok)); const servisler=tekil(l.map(a=>a.servis));
    return secimKarti(k,'kat',k,(bloklar.length?bloklar.join(', ')+' · ':'')+servisler.slice(0,3).join(', ')+(servisler.length>3?' …':'')); }).join('');
  $('#app').innerHTML=`<div class="kap">${ustBar('Yeni kayıt')}<div class="icerik">${mesaj?`<div class="uyari">${esc(mesaj)}</div>`:''}
    ${son.length&&alanlar.length?`<div class="grup"><h2>Son seçimler — tek dokunuşla başlat</h2>${son.map((x,i)=>`<button class="alan" data-son="${i}"><span class="ad">${esc(x.etiket)}<br><span style="font-weight:400;font-size:13px;color:var(--soluk)">${esc(x.alt)}</span></span></button>`).join('')}</div>`:''}
    ${adimBas(1,'Kat seçin')}${listeYok()}${kartlar}</div>
    ${altCubuk('geri','ileri',secim.kat.size?`Devam · ${secim.kat.size} kat`:'Devam',secim.kat.size)}</div>`;
  secimBagla();
  document.querySelectorAll('[data-son]').forEach(b=>b.onclick=()=>{ const x=son[+b.dataset.son]; secim={kat:new Set(x.kat),servis:new Set(x.servis),bolum:new Set(x.bolum)}; if(alanlar.some(a=>secim.servis.has(servisAnahtar(a)))) yeniKayit(secim); else { mesaj='Bu seçimdeki servisler listede artık yok.'; ciz(); } });
  $('#geri').onclick=()=>{ekran='ana';mesaj='';ciz();};
  $('#ileri').onclick=()=>{ [...secim.servis].forEach(k=>{ if(!secim.kat.has(k.split(SEP)[0])) secim.servis.delete(k); }); ekran='servis'; ciz(); window.scrollTo(0,0); };
}
function cizServis(){
  const katlar=tekil(alanlar.map(a=>a.kat)).filter(k=>secim.kat.has(k));
  const govde=katlar.map(k=>{ const gor=new Set(); const l=alanlar.filter(a=>a.kat===k&&!gor.has(servisAnahtar(a))&&gor.add(servisAnahtar(a)));
    return `<div class="grup"><h2>${esc(k)}</h2>${l.map(a=>{ const bs=tekil(alanlar.filter(x=>servisAnahtar(x)===servisAnahtar(a)).map(x=>x.bolum)); return secimKarti(servisAnahtar(a),'servis',a.servis,bs.length?bs.length+' bölüm':'bölüm tanımlı değil',a.blok); }).join('')}</div>`; }).join('');
  $('#app').innerHTML=`<div class="kap">${ustBar('Yeni kayıt')}<div class="icerik">${adimBas(2,'Servis seçin')}${govde}</div>
    ${altCubuk('geri','ileri',secim.servis.size?`Devam · ${secim.servis.size} servis`:'Devam',secim.servis.size)}</div>`;
  secimBagla();
  $('#geri').onclick=()=>{ekran='kat';ciz();window.scrollTo(0,0);};
  $('#ileri').onclick=()=>{ [...secim.bolum].forEach(k=>{ const p=k.split(SEP); if(!secim.servis.has(p.slice(0,3).join(SEP))) secim.bolum.delete(k); });
    const bolumVar=alanlar.some(a=>a.bolum&&secim.servis.has(servisAnahtar(a)));
    if(bolumVar){ ekran='bolum'; ciz(); window.scrollTo(0,0); } else yeniKayit(secim); };
}
function cizBolum(){
  const gor=new Set(); const servisler=alanlar.filter(a=>secim.servis.has(servisAnahtar(a))&&!gor.has(servisAnahtar(a))&&gor.add(servisAnahtar(a)));
  const govde=servisler.map(s=>{ const l=alanlar.filter(a=>servisAnahtar(a)===servisAnahtar(s)&&a.bolum); const baslik=[s.servis,s.kat,s.blok].filter(Boolean).join(' · ');
    if(!l.length) return `<div class="grup"><h2>${esc(baslik)}</h2><p class="ipucu" style="margin:0 4px 8px">Bölüm tanımlı değil; servis düzeyinde kaydedilir.</p></div>`;
    const anahtarlar=l.map(bolumAnahtar);
    return `<div class="grup"><h2 style="display:flex;justify-content:space-between;gap:8px">${esc(baslik)}${l.length>1?`<button class="bag" style="padding:0" data-hepsi='${esc(JSON.stringify(anahtarlar))}'>${anahtarlar.every(k=>secim.bolum.has(k))?'Hiçbiri':'Tümü'}</button>`:''}</h2>${l.map(a=>secimKarti(bolumAnahtar(a),'bolum',a.bolum,'',a.tip)).join('')}</div>`; }).join('');
  $('#app').innerHTML=`<div class="kap">${ustBar('Yeni kayıt')}<div class="icerik">${adimBas(3,'Bölüm seçin')}
    <p class="ipucu">Bölüm seçmediğiniz servisler servis düzeyinde kaydedilir.</p>${govde}</div>
    ${altCubuk('geri','ileri',secim.bolum.size?`Kaydı başlat · ${secim.bolum.size} bölüm`:'Servis düzeyinde başlat',true)}</div>`;
  secimBagla();
  $('#geri').onclick=()=>{ekran='servis';ciz();window.scrollTo(0,0);};
  $('#ileri').onclick=()=>yeniKayit(secim);
}

// ---------- Kayıt listesi ve rapor ----------
let kayitListesi=LS.get('kayitListesi',[]), listeFiltre='tum', listeArama='', listeYukleniyor=false, listeMesaj='';
let rapor=null, raporFotolar={}, buyukFoto=-1;

const riskRenk=r=>r==='Yüksek'?'var(--kirmizi)':r==='Orta'?'#C98A0B':r==='Az'?'#2F8F5B':'var(--cizgi)';
function cizListe(){
  const bugun=new Date().toLocaleDateString('tr-TR');
  const filtreler=[['tum','Tümü'],['bugun','Bugün'],['acik','Açık'],['yuksek','Yüksek risk'],['foto','Fotoğraflı'],['degerlendirilmedi','Değerlendirilmedi']];

    <div class="filtreler">${filtreler.map(([k,a])=>`<button class="filtre ${listeFiltre===k?'on':''}" data-f="${k}">${a}</button>`).join('')}</div>
    <p class="ipucu" style="margin:0 4px 8px">${l.length} kayıt</p>
    ${l.map(k=>`<button class="kayit-kart" data-id="${esc(k.id)}"><span class="omurga" style="background:${riskRenk(k.risk)}"></span><span class="ic2">
      <span class="ust2"><b>${esc(k.bolum||k.servis||'—')}</b><span>${esc(k.tarih)} ${esc(k.acilis)}</span></span>
      <span class="alt2">${esc([k.kat,k.bolum?k.servis:''].filter(Boolean).join(' · '))}</span>
      <span class="goz2">${esc(k.gozlem||'(gözlem metni yok)')}</span>
      <span class="etiketler2">${k.risk?`<span class="et2" style="background:${riskRenk(k.risk)};color:#fff">Risk ${esc(k.risk)}</span>`:''}${k.sas?`<span class="et2">${esc(k.sas)}</span>`:`<span class="et2 soluk">Değerlendirilmedi</span>`}${k.foto?`<span class="et2">${k.foto} foto</span>`:''}${k.hemen==='Evet'?`<span class="et2" style="background:var(--kirmizi2);color:var(--kirmizi)">Hemen müdahale</span>`:''}${k.durum?`<span class="et2 durum-${esc(k.durum).replace(/\s/g,'')}">${esc(k.durum)}</span>`:''}</span>
    </span></button>`).join('')||(listeYukleniyor?'':`<div class="bos"><b>Kayıt yok</b>Filtreyi değiştirin.</div>`)}
  </div>
  <div class="alt"><div class="ic"><button class="btn sessiz" id="geri" style="flex:1">Ana ekran</button></div></div></div>`;
  $('#yenile').onclick=listeYenile;
  $('#arama').oninput=e=>{ listeArama=e.target.value; const p=e.target.selectionStart; ciz(); const a=$('#arama'); a.focus(); a.setSelectionRange(p,p); };
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{listeFiltre=b.dataset.f;ciz();});
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>raporAc(b.dataset.id));
  $('#geri').onclick=()=>history.back();
}
async function raporAc(id){
  rapor={id,yukleniyor:true}; raporFotolar={}; buyukFoto=-1; ekran='rapor'; history.pushState({e:'rapor'},''); ciz(); window.scrollTo(0,0);
  try{ const j=await apiGet({action:'kayit',id});
    if(!j.ok){ rapor={id,hata:j.hata}; ciz(); return; }
    rapor={id,...j}; ciz();
    for(let i=0;i<j.fotolar.length;i++){
      if(!rapor||rapor.id!==id) return;
      try{ const f=await apiGet({action:'foto',id,i}); if(f.ok){ raporFotolar[i]=f.data; if(ekran==='rapor'&&rapor.id===id){ const im=$('#rf'+i); if(im){im.src=f.data;im.classList.add('hazir');} if(buyukFoto===i) ciz(); } } }catch(e){}
    }
  }catch(e){ rapor={id,hata:'Kayıt alınamadı; bağlantıyı kontrol edin.'}; ciz(); }
}
function cizRapor(){
  const r=rapor||{}; const a=r.alanlar||{}; const v=ad=>a[ad]||'';
  const satir=(et,deg,cls='')=>deg?`<div class="r-satir"><span>${et}</span><b class="${cls}">${esc(deg)}</b></div>`:'';
  const cip=(et,deg)=>`<div class="r-cip"><span>${et}</span><b style="${['Az','Orta','Yüksek'].includes(deg)?`color:${riskRenk(deg)}`:''}">${esc(deg||'—')}</b></div>`;
  let govde='';
  if(r.yukleniyor) govde=`<div class="bos"><b>Rapor hazırlanıyor</b>${esc(r.id)}</div>`;
  else if(r.hata) govde=`<div class="uyari">${esc(r.hata)}</div>`;
  else {
    const baslik=v('Bölüm')||v('Servis')||v('Alan (ruhsat)');
    govde=`
    <div class="r-kapak"><div class="r-ust"><span class="r-id">${esc(v('Kayıt ID'))}</span>${v('Durum')?`<span class="et2 durum-${esc(v('Durum')).replace(/\s/g,'')}">${esc(v('Durum'))}</span>`:''}</div>
      <h2>${esc(baslik)}</h2><p>${esc([v('Kat'),v('Blok'),v('Bölüm')?v('Servis'):''].filter(Boolean).join(' · '))}</p>
      <p class="r-meta">${esc(v('Tarih'))} · ${esc(v('Açılış'))}${v('Kapanış')&&v('Kapanış')!==v('Açılış')?'–'+esc(v('Kapanış')):''}${v('Denetçi')?' · '+esc(v('Denetçi')):''}</p></div>
    ${v('Hemen müdahale')==='Evet'?`<div class="r-alarm">Hemen müdahale gerekli${v('Kime bildirildi')?' · bildirildi: '+esc(v('Kime bildirildi')):''}</div>`:''}
    <section class="r-blok"><h3>Gözlem</h3><p class="r-gozlem">${esc(v('Gözlem (ses dökümü)'))||'<span class="soluk">Metin yok</span>'}</p>
      ${v('Konum detayı (ses)')?`<p class="r-konum"><span>Konum detayı</span>${esc(v('Konum detayı (ses)'))}</p>`:''}</section>
    ${r.fotolar&&r.fotolar.length?`<section class="r-blok"><h3>Fotoğraflar <small>${r.fotolar.length}</small></h3><div class="r-fotolar ${r.fotolar.length===1?'tek':''}">
      ${r.fotolar.map((f,i)=>`<img id="rf${i}" class="${raporFotolar[i]?'hazir':''}" src="${raporFotolar[i]||'data:image/gif;base64,R0lGODlhAQABAAAAACw='}" alt="Tespit fotoğrafı ${i+1}" data-buyut="${i}">`).join('')}</div>
      <p class="ipucu" style="margin:6px 0 0">Büyütmek için fotoğrafa dokunun</p></section>`:''}
    <section class="r-blok"><h3>Değerlendirme</h3>
      <div class="r-ciplar">${cip('Sıklık',v('Sıklık'))}${cip('Etki',v('Etki'))}${cip('Risk',v('Risk'))}</div>
      ${satir('SAS kodu',v('SAS kodu'))}${satir('DÖ kodu',v('DÖ kodu'))}${satir('Bulgu tipi',v('Bulgu tipi'))}${satir('Ön karar',v('Ön karar'))}${satir('Alan tipi',v('Alan tipi'))}
      ${!v('SAS kodu')&&!v('Risk')?'<p class="ipucu" style="margin:6px 0 0">Masa başı değerlendirmesi henüz yapılmadı.</p>':''}</section>
    ${v('Sorumlu birim')||v('DÖF no')||v('Termin')||v('Not')?`<section class="r-blok"><h3>Eylem ve takip</h3>
      ${satir('Sorumlu birim',v('Sorumlu birim'))}${satir('DÖF no',v('DÖF no'))}${satir('Termin',v('Termin'))}${v('Not')?`<p class="r-not">${esc(v('Not'))}</p>`:''}</section>`:''}
    <section class="r-blok r-sistem">${satir('Cihaz',v('Cihaz'))}${satir('Sisteme alındı',v('Sisteme alındı'))}${r.sesler&&r.sesler.length?satir('Ses kayıtları',r.sesler.length+' dosya'):''}${r.satir?satir('Tablo satırı',String(r.satir)):''}</section>`;
  }
  $('#app').innerHTML=`<div class="kap">${ustBar('Bulgu raporu')}<div class="icerik rapor">${govde}</div>
    <div class="alt"><div class="ic"><button class="btn sessiz" id="geri">Liste</button>${r.alanlar?`<button class="btn ikincil" id="paylas">Paylaş</button>`:''}</div></div>
    ${buyukFoto>=0?`<div class="tamekran" id="tamekran"><img src="${raporFotolar[buyukFoto]||''}" alt="Tespit fotoğrafı"><span class="sayac2">${buyukFoto+1} / ${r.fotolar.length}${raporFotolar[buyukFoto]?'':' · yükleniyor'}</span><span class="ipucu2">Kapatmak için dokunun</span></div>`:''}</div>`;
  $('#geri').onclick=()=>history.back();
  document.querySelectorAll('[data-buyut]').forEach(im=>im.onclick=()=>{ buyukFoto=+im.dataset.buyut; ciz(); });
  const t=$('#tamekran'); if(t){
    let x0=null; t.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
    t.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-(x0??0); const n=r.fotolar.length;
      if(Math.abs(dx)>50&&n>1){ buyukFoto=(buyukFoto+(dx<0?1:-1)+n)%n; } else buyukFoto=-1; x0=null; ciz(); });
    t.onclick=e=>{ if(!('ontouchend' in window)){ buyukFoto=-1; ciz(); } };
  }
  const p=$('#paylas'); if(p) p.onclick=async()=>{
    const metin=[`Bulgu raporu — ${v('Kayıt ID')}`,`${v('Tarih')} ${v('Açılış')} · ${v('Denetçi')}`,[v('Kat'),v('Blok'),v('Servis'),v('Bölüm')].filter(Boolean).join(' · '),
      '',`Gözlem: ${v('Gözlem (ses dökümü)')}`, v('Konum detayı (ses)')?`Konum: ${v('Konum detayı (ses)')}`:'',
      v('Risk')?`Sıklık/Etki/Risk: ${v('Sıklık')||'—'} / ${v('Etki')||'—'} / ${v('Risk')}`:'', v('SAS kodu')?`SAS: ${v('SAS kodu')} ${v('DÖ kodu')}`:'',
      v('Durum')?`Durum: ${v('Durum')}`:'', r.fotolar&&r.fotolar.length?`Fotoğraf: ${r.fotolar.length}`:''].filter((x,i)=>x!==''||i===3).join('\n');
    try{ if(navigator.share) await navigator.share({title:'Bulgu raporu',text:metin}); else { await navigator.clipboard.writeText(metin); p.textContent='Kopyalandı'; } }catch(e){}
  };
}
window.addEventListener('popstate',()=>{
  if(buyukFoto>=0&&ekran==='rapor'){ buyukFoto=-1; history.pushState({e:'rapor'},''); ciz(); return; }
  if(ekran==='rapor'){ ekran='liste'; rapor=null; ciz(); listeYenile(); }
  else if(ekran==='liste'){ ekran='ana'; ciz(); }
});

function ciplerAlan(alan,secenekler,onEk=''){
  return `<div class="cipler">${secenekler.map(([d,e,alt])=>`<button class="cip ${onEk?onEk+d:''} ${taslakDeger(alan)===d?'secili':''}" data-deger-alan="${alan}" data-deger="${d}">${e}${alt?`<small>${alt}</small>`:''}</button>`).join('')}</div>`;
}
const taslakDeger=alan=>aktif?aktif[alan]:undefined;
function micBtn(hedef,boyut,etiket){
  const acik=kayit&&kayit.hedef===hedef;
  return `<button class="mik ${boyut} ${acik?'kayitta':''}" data-mik="${hedef}">${acik?'<span class="nabiz"></span> Durdur':MIK+' '+etiket}</button>`;
}
function cizKayit(){
  const a=aktif; const acik=k=>kayit&&kayit.hedef===k;
  const parcaHtml=(p,i,tur)=>`<div class="parca"><p>${esc(p.metin)||'<span class="ara">(yalnız ses kaydı)</span>'}${p.ses?` <span class="ara">· ${p.ses.sure} sn ses</span>`:''}</p><button class="sil" data-sil="${tur}" data-i="${i}" aria-label="Sil">×</button></div>`;
  $('#app').innerHTML=`<div class="kap">${ustBar(esc(a.baslik||a.alan),`<span class="rozet">${esc(a.acilis)}</span>`)}
  ${a.altBaslik||a.servis?`<div class="kapsam">${a.kat?`<b>${esc(a.kat)}</b> · `:''}${esc(a.servis||a.alan)}${a.bolum?` — ${esc(a.bolum)}`:''}</div>`:''}
  <div class="icerik">${a.uyari?`<div class="uyari">${esc(a.uyari)}</div>`:''}
    <div class="durumSatir" style="margin:0 2px 10px">Metne çevirme: ${SR?'açık':'<b style="color:var(--kirmizi)">bu tarayıcıda yok</b>'} · Ses dosyası: ${sesDosyasiAcik()?'saklanıyor':'saklanmıyor'}</div>
    <div class="blok"><div class="blok-bas"><b>Konum detayı</b><span>kısa: oda, dolap, cihaz</span></div>
      ${micBtn('konum','kucuk',a.konum?'Yeniden söyle':'Konumu söyle')}
      ${acik('konum')?`<div class="parca"><p id="canli"></p></div>`:a.konum?parcaHtml(a.konum,0,'konum'):''}
    </div>
    <div class="blok"><div class="blok-bas"><b>Gözlem</b><span>${a.gozlem.length?a.gozlem.length+' parça':'ne gördüğünüzü anlatın'}</span></div>
      ${micBtn('gozlem','buyuk',a.gozlem.length?'Ekleme yap':'Konuşarak kaydet')}
      ${a.gozlem.map((p,i)=>parcaHtml(p,i,'gozlem')).join('')}
      ${acik('gozlem')?`<div class="parca"><p id="canli"></p></div>`:''}
    </div>
    <div class="blok"><div class="blok-bas"><b>Fotoğraf</b><span>hasta ve belge içeriği görünmesin</span></div>
      <div style="display:flex;gap:8px"><button class="mik kucuk" id="fotoBtn" style="background:#2E4057;flex:1">${KAM} Kamera</button><button class="mik kucuk" id="galeriBtn" style="background:#fff;color:#2E4057;border:1.5px solid #2E4057;flex:1">${GAL} Galeri</button></div>
      ${a.fotolar.length?`<div class="fotolar">${a.fotolar.map((f,i)=>`<div class="foto"><img src="data:image/jpeg;base64,${f.kucuk||f.data}" alt="Tespit fotoğrafı ${i+1}"><button class="sil" data-sil="foto" data-i="${i}" aria-label="Fotoğrafı sil">×</button></div>`).join('')}</div>`:''}
    </div>
    <div class="blok deger-blok"><div class="blok-bas"><b>Ön değerlendirme</b><span>isteğe bağlı · sahada</span></div>
      <div class="deger-alt">Bulgu tipi</div>${ciplerAlan('tip',[['F','Fiziksel'],['U','Uygulama'],['K','Kayıt'],['C','Cihaz']])}
      <div class="deger-alt">Sıklık</div>${ciplerAlan('siklik',[['Az','Az','tekil'],['Orta','Orta','aynı alanda tekrar'],['Yüksek','Yüksek','birden çok alan']],'r-')}
      <div class="deger-alt">Etki alanı</div>${ciplerAlan('etki',[['Bireysel','Bireysel'],['Sistemsel','Sistemsel']],'e-')}
      <div class="deger-alt">Risk düzeyi</div>${ciplerAlan('risk',[['Az','Az'],['Orta','Orta'],['Yüksek','Yüksek']],'r-')}
      <div class="deger-alt">Hemen müdahale</div>${ciplerAlan('acil',[['H','Hayır'],['E','Evet']],'a-')}
      ${a.acil==='E'?`<div class="parca" style="margin-top:8px"><p>${a.acilKime?esc(a.acilKime):'<span class="ara">Kime bildirildi?</span>'}</p></div>
        ${micBtn('kime','kucuk',a.acilKime?'Yeniden söyle':'Kime bildirildi, söyle')}
        <div class="bilgi">Sorumluya yerinde bildirin; bu işaret SAS kararından ayrıdır.</div>`:''}
      ${acik('kime')?`<div class="parca"><p id="canli"></p></div>`:''}
    </div>
  </div>
  <div class="alt"><div class="ic"><button class="btn sessiz" id="vazgec">Vazgeç</button><button class="btn birincil" id="kapat" ${(!a.gozlem.length&&!a.fotolar.length&&!acik('gozlem'))?'disabled':''}>Kaydı kapat</button></div></div></div>`;
  canliYaz();
  document.querySelectorAll('[data-deger-alan]').forEach(b=>b.onclick=()=>{ const al=b.dataset.degerAlan,d=b.dataset.deger;
    a[al]=a[al]===d?undefined:d; if(al==='acil'&&a.acil!=='E') a.acilKime=''; taslakSakla(); const y=window.scrollY; cizKayit(); window.scrollTo(0,y); });
  document.querySelectorAll('[data-mik]').forEach(b=>b.onclick=async()=>{ const h=b.dataset.mik; if(kayit&&kayit.hedef===h){await sesDurdur();ciz();} else sesBaslat(h); });
  $('#fotoBtn').onclick=kameraAc;
  $('#galeriBtn').onclick=()=>{ if(kayit){ sesDurdur().then(ciz); } $('#galeri').click(); };
  document.querySelectorAll('[data-sil]').forEach(b=>b.onclick=()=>{ if(!confirm('Silinsin mi?'))return; const t=b.dataset.sil,i=+b.dataset.i;
    if(t==='konum')a.konum=null; else if(t==='gozlem')a.gozlem.splice(i,1); else a.fotolar.splice(i,1); taslakSakla(); ciz(); });
  $('#kapat').onclick=async()=>{ $('#kapat').disabled=true; await kaydiKapat(); };
  $('#vazgec').onclick=async()=>{ if((a.gozlem.length||a.fotolar.length)&&!confirm('Bu kayıt gönderilmeden silinsin mi?'))return; if(kayit)await sesDurdur(); aktif=null; localStorage.removeItem('taslak'); ekran='ana'; ciz(); };
}

function cizAyar(){
  const s=ayar();
  $('#app').innerHTML=`<div class="kap">${ustBar('Ayarlar')}
  <div class="icerik ayar"><div class="blok">
    ${s.api?`<div class="durum ok" style="margin:0 0 12px">Google Sheets bağlantısı tanımlı</div>`:`<div class="uyari" style="margin:0 0 12px">Bağlantı yok. Koordinatörlüğün verdiği kurulum linkini bu telefonda bir kez açın.</div>`}
    <label for="denetci">Denetçi adı</label><input id="denetci" value="${esc(s.denetci)}" placeholder="Örn. Dr. T. Soyal" autocomplete="name">
    <div class="anahtar"><span>Ses dosyasını da sakla<br><span style="font-size:13px;color:var(--soluk)">${ANDROID&&SR?'Android\'de kapalı tutulur; açıkken konuşma metne çevrilemiyor':'Kapatılırsa yalnız metin gönderilir'}</span></span><input type="checkbox" id="sesSakla" ${s.sesSakla?'checked':''}></div>
  </div></div>
  <div class="alt"><div class="ic"><button class="btn birincil" id="kaydet">Kaydet</button></div></div></div>`;
  $('#kaydet').onclick=()=>{ const d=$('#denetci').value.trim(); if(!d){$('#denetci').focus();return;} LS.set('denetci',d); LS.set('sesSakla',$('#sesSakla').checked); ekran='ana'; ciz(); alanlariGetir(); };
}

// ---------- Başlat ----------
(async()=>{
  const t=LS.get('taslak',null); if(t){ aktif=t; if(!aktif.servis&&aktif.alan){aktif.servis=aktif.alan;aktif.baslik=aktif.alan;} ekran='kayit'; }
  try{ const q=await DB.hepsi(); kuyrukSayisi=q.length; const ids=new Set(q.map(x=>x.id)); gecmis.forEach(g=>{ if(g.durum==='hata'&&ids.has(g.id)){g.durum='bekliyor';g.hata='';} }); LS.set('gecmis',gecmis); }catch(e){}
  ciz(); alanlariGetir(); gonder();
  window.addEventListener('online',()=>{ciz();gonder();}); window.addEventListener('offline',ciz);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') gonder(); });
})();
</script></body></html>
