<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saha Denetimi">
<meta name="theme-color" content="#0E6655">
<title>Saha Denetimi</title>
<style>
:root{--bg:#EEF3F1;--kart:#FFF;--ink:#16211D;--soluk:#5D6A66;--cizgi:#CFD9D5;--ana:#0E6655;--ana2:#DDEFEA;--kirmizi:#B83A26;--kirmizi2:#FBE7E3;--sari:#8A5A00;--sari2:#FFF1CC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--ana);outline-offset:2px}
.kap{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:120px}
header{position:sticky;top:0;z-index:5;background:var(--ana);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:19px}
.ust-satir{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rozet{font-size:13px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;white-space:nowrap}
.rozet.kirmizi{background:#E86A55}
.alt-bilgi{font-size:13px;opacity:.85;margin-top:4px}
.icerik{padding:12px}
.bos{text-align:center;color:var(--soluk);padding:40px 16px}
.bos b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.satir-kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.satir-kart .baslik{font-weight:700}
.satir-kart .kucuk{font-size:14px;color:var(--soluk)}
.durum{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;margin-top:6px}
.durum.ok{background:var(--ana2);color:var(--ana)} .durum.bekliyor{background:var(--sari2);color:var(--sari)} .durum.hata{background:var(--kirmizi2);color:var(--kirmizi)}
.alt{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--kart);border-top:1px solid var(--cizgi);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.alt .ic{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:60px;border-radius:14px;font-weight:700;font-size:18px}
.btn.birincil{background:var(--ana);color:#fff}
.btn.ikincil{background:var(--ana2);color:var(--ana)}
.btn.sessiz{background:#fff;border:1.5px solid var(--cizgi);flex:.45}
.btn:disabled{opacity:.45}
/* Alan menüsü */
.grup{margin-bottom:14px}
.grup h2{font-size:14px;color:var(--soluk);margin:6px 4px 6px;font-weight:600}
.alan{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:14px;margin-bottom:8px;min-height:62px}
.alan .ad{flex:1;font-weight:600}
.tip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--ana2);color:var(--ana)}
.tip.Teknik{background:#E6E3F5;color:#4B3F9A} .tip.Genel{background:#EDEDED;color:#4A4A4A}
/* Kayıt ekranı */
.blok{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-bottom:12px}
.blok-bas{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.blok-bas b{font-size:16px} .blok-bas span{font-size:13px;color:var(--soluk)}
.mik{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px;font-weight:700;background:var(--ana);color:#fff}
.mik.buyuk{min-height:96px;font-size:20px} .mik.kucuk{min-height:62px;font-size:17px}
.mik.kayitta{background:var(--kirmizi)}
.mik svg{width:30px;height:30px;flex:none}
.nabiz{width:14px;height:14px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:no-preference){.kayitta .nabiz{animation:nb 1s infinite}@keyframes nb{50%{opacity:.25}}}
.dokum{margin-top:10px;font-size:16px;min-height:0}
.parca{display:flex;gap:8px;align-items:flex-start;background:#F7FAF9;border-radius:10px;padding:10px;margin-top:8px}
.parca p{margin:0;flex:1}
.parca .ara{color:var(--soluk)}
.sil{flex:none;min-width:44px;min-height:44px;border-radius:10px;background:var(--kirmizi2);color:var(--kirmizi);font-weight:700;font-size:20px;line-height:1}
.uyari{font-size:14px;background:var(--sari2);color:var(--sari);border-radius:10px;padding:9px 11px;margin-top:8px}
.fotolar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .sil{position:absolute;top:4px;right:4px;min-width:38px;min-height:38px;font-size:18px}
input[type=file]{display:none}
.ayar input{width:100%;min-height:52px;border:1.5px solid var(--cizgi);border-radius:12px;padding:0 12px;font:inherit;margin:6px 0 12px}
.ayar label{font-weight:600;font-size:15px}
.anahtar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--cizgi)}
.anahtar input{width:26px;height:26px;accent-color:var(--ana)}
.bag{color:var(--ana);font-weight:600;padding:10px 4px}
</style></head>
<body><div id="app"></div>
<input type="file" id="kamera" accept="image/*" capture="environment">
<input type="file" id="galeri" accept="image/*" multiple>
<script>
"use strict";
// ---------- Ayarlar ----------
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)) };
(function linktenKur(){
  const p=new URLSearchParams(location.search);
  if(p.get('api')&&p.get('token')){ LS.set('api',p.get('api')); LS.set('token',p.get('token')); history.replaceState(null,'',location.pathname); }
})();
const ayar=()=>({api:LS.get('api',''),token:LS.get('token',''),denetci:LS.get('denetci',''),sesSakla:LS.get('sesSakla',true)});

// ---------- IndexedDB kuyruğu ----------
const DB={ ac(){return new Promise((res,rej)=>{const r=indexedDB.open('saha-denetimi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kuyruk',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async islem(mod,fn){const db=await this.ac();return new Promise((res,rej)=>{const tx=db.transaction('kuyruk',mod);const st=tx.objectStore('kuyruk');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});},
  koy(k){return this.islem('readwrite',s=>s.put(k));}, sil(id){return this.islem('readwrite',s=>s.delete(id));}, hepsi(){return this.islem('readonly',s=>s.getAll());} };

// ---------- Durum ----------
let ekran='ana', aktif=null, alanlar=LS.get('alanlar',[]), gecmis=LS.get('gecmis',[]), kuyrukSayisi=0, gonderiliyor=false, mesaj='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yerelGun=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const saat=()=>new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const MIK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';
const GAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
const KAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>';

// ---------- Ses: tanıma + dosya ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let kayit=null; // {hedef:'konum'|'gozlem', tanima, recorder, parcalar[], metin, ara, dur}
async function sesBaslat(hedef){
  if(kayit) await sesDurdur();
  const k={hedef,metin:'',ara:'',durdu:false,parcalar:[],baslangic:Date.now()};
  kayit=k;
  try{ if('wakeLock' in navigator) k.kilit=await navigator.wakeLock.request('screen'); }catch(e){}
  if(ayar().sesSakla && navigator.mediaDevices && window.MediaRecorder){
    try{
      k.akis=await navigator.mediaDevices.getUserMedia({audio:true});
      const tip=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
      k.recorder=new MediaRecorder(k.akis,tip?{mimeType:tip,audioBitsPerSecond:32000}:undefined);
      k.recorder.ondataavailable=e=>{if(e.data.size)k.parcalar.push(e.data)};
      k.recorder.start(1000);
    }catch(e){ aktif.uyari='Ses dosyası kaydedilemedi (mikrofon izni?). Metne dönüştürme denenecek.'; }
  }
  if(SR){
    const t=new SR(); t.lang='tr-TR'; t.continuous=true; t.interimResults=true;
    t.onresult=ev=>{ let ara=''; for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i]; if(r.isFinal) k.metin+=(k.metin?' ':'')+r[0].transcript.trim(); else ara+=r[0].transcript;} k.ara=ara; canliYaz(); };
    t.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){aktif.uyari='Konuşma tanıma izni verilmedi. Ses dosyası yine de saklanır; metin sonra elle eklenebilir.';k.durdu=true;ciz();}
      else if(ev.error==='audio-capture'){aktif.uyari='Bu telefonda mikrofon aynı anda hem kayda hem metne dönüştürmeye verilemiyor. Ayarlar\'dan "Ses dosyasını da sakla"yı kapatın.';k.durdu=true;ciz();}
      else if(ev.error==='network'){aktif.uyari='Metne dönüştürme için internet gerekiyor. Ses dosyası saklanıyor; metin sonra eklenebilir.';k.durdu=true;ciz();} };
    t.onend=()=>{ if(kayit===k&&!k.durdu){ try{t.start()}catch(e){} } }; // iOS/Android sessizlikte durdurur; yeniden başlat
    try{t.start();k.tanima=t;}catch(e){}
  } else if(!k.recorder){ aktif.uyari='Bu tarayıcı konuşma tanımayı desteklemiyor. Android\'de Chrome, iPhone\'da Safari kullanın.'; }
  else { aktif.uyari='Bu tarayıcıda metne dönüştürme yok; yalnız ses dosyası saklanıyor.'; }
  k.zamanlayici=setTimeout(()=>{ if(kayit===k) sesDurdur().then(ciz); },180000);
  ciz();
}
function canliYaz(){ const el=$('#canli'); if(el&&kayit) el.innerHTML=esc(kayit.metin)+(kayit.ara?` <span class="ara">${esc(kayit.ara)}</span>`:''); }
async function sesDurdur(){
  const k=kayit; if(!k) return; kayit=null; k.durdu=true; clearTimeout(k.zamanlayici);
  try{k.tanima&&k.tanima.stop()}catch(e){}
  if(k.recorder&&k.recorder.state!=='inactive'){ await new Promise(r=>{k.recorder.onstop=r;k.recorder.stop();}); }
  if(k.akis) k.akis.getTracks().forEach(t=>t.stop());
  try{k.kilit&&k.kilit.release()}catch(e){}
  await new Promise(r=>setTimeout(r,350)); // son sonuçların gelmesi için
  const metin=(k.metin+(k.ara?' '+k.ara:'')).trim();
  let ses=null;
  if(k.parcalar.length){ const blob=new Blob(k.parcalar,{type:k.recorder.mimeType||'audio/webm'}); ses={mime:blob.type.split(';')[0],uzanti:blob.type.includes('mp4')?'m4a':'webm',data:await b64(blob),sure:Math.round((Date.now()-k.baslangic)/1000)}; }
  if(!metin&&!ses) return;
  const parca={metin,ses,saat:saat()};
  if(k.hedef==='konum') aktif.konum=parca; else aktif.gozlem.push(parca);
  taslakSakla();
}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob);});

// ---------- Fotoğraf (kamera veya galeri) ----------
function kucult(img,maks,kalite){ const o=Math.min(1,maks/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*o); c.height=Math.round(img.naturalHeight*o);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',kalite).split(',')[1]; }
async function fotoEkle(dosyalar){
  if(!aktif) return;
  for(const dosya of dosyalar){
    try{
      const url=URL.createObjectURL(dosya);
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
      aktif.fotolar.push({mime:'image/jpeg',uzanti:'jpg',data:kucult(img,1600,0.8),kucuk:kucult(img,700,0.7),saat:saat()});
      URL.revokeObjectURL(url);
    }catch(e){ aktif.uyari='Bir fotoğraf okunamadı (desteklenmeyen biçim olabilir).'; }
  }
  taslakSakla(); ciz();
}
['kamera','galeri'].forEach(id=>$('#'+id).addEventListener('change',e=>{ const f=[...e.target.files]; e.target.value=''; fotoEkle(f); }));

// ---------- Kayıt yaşam döngüsü ----------
function yeniKayit(alan){
  const n=new Date();
  const hms=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join('');
  aktif={id:'SD-'+yerelGun(n).replace(/-/g,'')+hms+'-'+Math.random().toString(36).slice(2,6),
    tarih:n.toLocaleDateString('tr-TR'),tarihISO:yerelGun(n),acilis:saat(),
    blok:alan.blok,kat:alan.kat,alan:alan.ad,alanTipi:alan.tip,konum:null,gozlem:[],fotolar:[],uyari:''};
  const son=LS.get('sonAlanlar',[]).filter(a=>a!==alan.ad); son.unshift(alan.ad); LS.set('sonAlanlar',son.slice(0,5));
  ekran='kayit'; taslakSakla(); ciz(); window.scrollTo(0,0);
}
function taslakSakla(){ try{LS.set('taslak',aktif)}catch(e){ /* kota dolarsa fotoğraflar yalnız bellekte kalır */ try{LS.set('taslak',{...aktif,fotolar:[]})}catch(_){} } }
async function kaydiKapat(){
  if(kayit) await sesDurdur();
  const s=ayar();
  const paket={id:aktif.id,tarih:aktif.tarih,tarihISO:aktif.tarihISO,acilis:aktif.acilis,kapanis:saat(),denetci:s.denetci,
    blok:aktif.blok,kat:aktif.kat,alan:aktif.alan,alanTipi:aktif.alanTipi,
    konumDetay:aktif.konum?aktif.konum.metin:'',
    gozlem:aktif.gozlem.map(p=>p.metin).filter(Boolean).join('\n'),
    fotolar:aktif.fotolar.map(({mime,uzanti,data,kucuk})=>({mime,uzanti,data,kucuk})),
    sesler:[aktif.konum,...aktif.gozlem].filter(p=>p&&p.ses).map(p=>({mime:p.ses.mime,uzanti:p.ses.uzanti,data:p.ses.data})),
    cihaz:navigator.userAgent.includes('iPhone')?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Bilgisayar'};
  await DB.koy(paket);
  gecmis.unshift({id:paket.id,alan:paket.alan,saat:paket.kapanis,ozet:(paket.gozlem||'(metin yok)').slice(0,90),foto:paket.fotolar.length,durum:'bekliyor'});
  LS.set('gecmis',gecmis.slice(0,60)); localStorage.removeItem('taslak');
  aktif=null; ekran='ana'; ciz(); gonder();
}
async function gonder(){
  if(gonderiliyor) return; const s=ayar(); if(!s.api) return;
  gonderiliyor=true;
  try{
    const liste=await DB.hepsi(); kuyrukSayisi=liste.length; ciz();
    for(const p of liste){
      const g=gecmis.find(x=>x.id===p.id);
      try{
        const r=await fetch(s.api,{method:'POST',body:JSON.stringify({token:s.token,action:'kayit',kayit:p})});
        const j=await r.json();
        if(j.ok){ await DB.sil(p.id); if(g){g.durum='ok';g.satir=j.satir;} }
        else { if(g){g.durum='hata';g.hata=j.hata;} if(/Yetkisiz/.test(j.hata||'')) break; }
      }catch(e){ if(g){g.durum='bekliyor';} break; } // bağlantı yok: sonra tekrar
      LS.set('gecmis',gecmis); kuyrukSayisi=(await DB.hepsi()).length; ciz();
    }
  } finally { gonderiliyor=false; kuyrukSayisi=(await DB.hepsi()).length; ciz(); }
}
async function alanlariGetir(){
  const s=ayar(); if(!s.api) return;
  try{ const r=await fetch(`${s.api}?action=alanlar&token=${encodeURIComponent(s.token)}`); const j=await r.json();
    if(j.ok){ alanlar=j.alanlar; LS.set('alanlar',alanlar); mesaj=''; } else mesaj=j.hata;
  }catch(e){ mesaj=alanlar.length?'Çevrimdışı: kayıtlı alan listesi kullanılıyor.':'Alan listesi alınamadı; bağlantıyı kontrol edin.'; }
  ciz();
}

// ---------- Ekranlar ----------
function ciz(){ ({ana:cizAna,menu:cizMenu,kayit:cizKayit,ayar:cizAyar})[ekran](); }
function ustBar(baslik,sag=''){ const s=ayar();
  return `<header><div class="ust-satir"><h1>${baslik}</h1>${sag}</div>
  <div class="alt-bilgi">${esc(s.denetci||'Denetçi seçilmedi')} · ${navigator.onLine?'Çevrimiçi':'Çevrimdışı'}${kuyrukSayisi?` · ${kuyrukSayisi} kayıt gönderilmeyi bekliyor`:''}</div></header>`; }

function cizAna(){
  const s=ayar();
  if(!s.api||!s.denetci){ ekran='ayar'; return cizAyar(); }
  const bugun=gecmis.filter(g=>g.id.startsWith('SD-'+yerelGun().replace(/-/g,'')));
  $('#app').innerHTML=`<div class="kap">${ustBar('Saha denetimi',`<button class="rozet" id="ayarBtn">Ayarlar</button>`)}
    <div class="icerik">${mesaj?`<div class="uyari">${esc(mesaj)}</div>`:''}
    ${bugun.length?bugun.map(g=>`<div class="satir-kart"><div class="baslik">${esc(g.alan)}</div><div class="kucuk">${esc(g.saat)} · ${g.foto} fotoğraf</div><div>${esc(g.ozet)}</div>
      <span class="durum ${g.durum}">${g.durum==='ok'?'Tabloya işlendi':g.durum==='hata'?'Hata: '+esc(g.hata||''):'Gönderilmeyi bekliyor'}</span></div>`).join('')
      :`<div class="bos"><b>Bugün kayıt yok</b>Yeni kayıt açın, alanı menüden seçin, konuşun ve fotoğraf çekin.</div>`}
    ${kuyrukSayisi?`<button class="bag" id="tekrar">Bekleyenleri şimdi gönder</button>`:''}</div>
    <div class="alt"><div class="ic"><button class="btn birincil" id="yeni">Yeni kayıt</button></div></div></div>`;
  $('#yeni').onclick=()=>{ekran='menu';ciz();alanlariGetir();window.scrollTo(0,0);};
  $('#ayarBtn').onclick=()=>{ekran='ayar';ciz();};
  const t=$('#tekrar'); if(t) t.onclick=gonder;
}

function cizMenu(){
  const son=LS.get('sonAlanlar',[]).map(ad=>alanlar.find(a=>a.ad===ad)).filter(Boolean);
  const gruplar={}; alanlar.forEach(a=>{const g=[a.blok&&a.blok+' blok',a.kat].filter(Boolean).join(' · ')||'Diğer';(gruplar[g]=gruplar[g]||[]).push(a);});
  const satir=a=>`<button class="alan" data-ad="${esc(a.ad)}"><span class="ad">${esc(a.ad)}</span><span class="tip ${esc(a.tip)}">${esc(a.tip||'')}</span></button>`;
  $('#app').innerHTML=`<div class="kap">${ustBar('Alan seçin')}
    <div class="icerik">${mesaj?`<div class="uyari">${esc(mesaj)}</div>`:''}
    ${!alanlar.length?`<div class="bos"><b>Alan listesi yükleniyor</b>Liste Google Sheets'teki "Alanlar" sayfasından gelir.</div>`:''}
    ${son.length?`<div class="grup"><h2>Son kullanılanlar</h2>${son.map(satir).join('')}</div>`:''}
    ${Object.entries(gruplar).map(([g,l])=>`<div class="grup"><h2>${esc(g)}</h2>${l.map(satir).join('')}</div>`).join('')}</div>
    <div class="alt"><div class="ic"><button class="btn sessiz" id="geri" style="flex:1">Geri</button></div></div></div>`;
  document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>yeniKayit(alanlar.find(a=>a.ad===b.dataset.ad)));
  $('#geri').onclick=()=>{ekran='ana';ciz();};
}

function micBtn(hedef,boyut,etiket){
  const acik=kayit&&kayit.hedef===hedef;
  return `<button class="mik ${boyut} ${acik?'kayitta':''}" data-mik="${hedef}">${acik?'<span class="nabiz"></span> Durdur':MIK+' '+etiket}</button>`;
}
function cizKayit(){
  const a=aktif; const acik=k=>kayit&&kayit.hedef===k;
  const parcaHtml=(p,i,tur)=>`<div class="parca"><p>${esc(p.metin)||'<span class="ara">(yalnız ses kaydı)</span>'}${p.ses?` <span class="ara">· ${p.ses.sure} sn ses</span>`:''}</p><button class="sil" data-sil="${tur}" data-i="${i}" aria-label="Sil">×</button></div>`;
  $('#app').innerHTML=`<div class="kap">${ustBar(esc(a.alan),`<span class="rozet">${esc(a.acilis)}</span>`)}
  <div class="icerik">${a.uyari?`<div class="uyari">${esc(a.uyari)}</div>`:''}
    <div class="blok"><div class="blok-bas"><b>Konum detayı</b><span>kısa: oda, dolap, cihaz</span></div>
      ${micBtn('konum','kucuk',a.konum?'Yeniden söyle':'Konumu söyle')}
      ${acik('konum')?`<div class="parca"><p id="canli"></p></div>`:a.konum?parcaHtml(a.konum,0,'konum'):''}
    </div>
    <div class="blok"><div class="blok-bas"><b>Gözlem</b><span>${a.gozlem.length?a.gozlem.length+' parça':'ne gördüğünüzü anlatın'}</span></div>
      ${micBtn('gozlem','buyuk',a.gozlem.length?'Ekleme yap':'Konuşarak kaydet')}
      ${a.gozlem.map((p,i)=>parcaHtml(p,i,'gozlem')).join('')}
      ${acik('gozlem')?`<div class="parca"><p id="canli"></p></div>`:''}
    </div>
    <div class="blok"><div class="blok-bas"><b>Fotoğraf</b><span>hasta ve belge içeriği görünmesin</span></div>
      <div style="display:flex;gap:8px"><button class="mik kucuk" id="fotoBtn" style="background:#2E4057;flex:1">${KAM} Kamera</button><button class="mik kucuk" id="galeriBtn" style="background:#fff;color:#2E4057;border:1.5px solid #2E4057;flex:1">${GAL} Galeri</button></div>
      ${a.fotolar.length?`<div class="fotolar">${a.fotolar.map((f,i)=>`<div class="foto"><img src="data:image/jpeg;base64,${f.kucuk||f.data}" alt="Tespit fotoğrafı ${i+1}"><button class="sil" data-sil="foto" data-i="${i}" aria-label="Fotoğrafı sil">×</button></div>`).join('')}</div>`:''}
    </div>
  </div>
  <div class="alt"><div class="ic"><button class="btn sessiz" id="vazgec">Vazgeç</button><button class="btn birincil" id="kapat" ${(!a.gozlem.length&&!a.fotolar.length&&!acik('gozlem'))?'disabled':''}>Kaydı kapat</button></div></div></div>`;
  canliYaz();
  document.querySelectorAll('[data-mik]').forEach(b=>b.onclick=async()=>{ const h=b.dataset.mik; if(kayit&&kayit.hedef===h){await sesDurdur();ciz();} else sesBaslat(h); });
  $('#fotoBtn').onclick=async()=>{ if(kayit){await sesDurdur();} $('#kamera').click(); };
  $('#galeriBtn').onclick=async()=>{ if(kayit){await sesDurdur();} $('#galeri').click(); };
  document.querySelectorAll('[data-sil]').forEach(b=>b.onclick=()=>{ if(!confirm('Silinsin mi?'))return; const t=b.dataset.sil,i=+b.dataset.i;
    if(t==='konum')a.konum=null; else if(t==='gozlem')a.gozlem.splice(i,1); else a.fotolar.splice(i,1); taslakSakla(); ciz(); });
  $('#kapat').onclick=async()=>{ $('#kapat').disabled=true; await kaydiKapat(); };
  $('#vazgec').onclick=async()=>{ if((a.gozlem.length||a.fotolar.length)&&!confirm('Bu kayıt gönderilmeden silinsin mi?'))return; if(kayit)await sesDurdur(); aktif=null; localStorage.removeItem('taslak'); ekran='ana'; ciz(); };
}

function cizAyar(){
  const s=ayar();
  $('#app').innerHTML=`<div class="kap">${ustBar('Ayarlar')}
  <div class="icerik ayar"><div class="blok">
    ${s.api?`<div class="durum ok" style="margin:0 0 12px">Google Sheets bağlantısı tanımlı</div>`:`<div class="uyari" style="margin:0 0 12px">Bağlantı yok. Koordinatörlüğün verdiği kurulum linkini bu telefonda bir kez açın.</div>`}
    <label for="denetci">Denetçi adı</label><input id="denetci" value="${esc(s.denetci)}" placeholder="Örn. Dr. T. Soyal" autocomplete="name">
    <div class="anahtar"><span>Ses dosyasını da sakla<br><span style="font-size:13px;color:var(--soluk)">Kapatılırsa yalnız metin gönderilir</span></span><input type="checkbox" id="sesSakla" ${s.sesSakla?'checked':''}></div>
  </div></div>
  <div class="alt"><div class="ic"><button class="btn birincil" id="kaydet">Kaydet</button></div></div></div>`;
  $('#kaydet').onclick=()=>{ const d=$('#denetci').value.trim(); if(!d){$('#denetci').focus();return;} LS.set('denetci',d); LS.set('sesSakla',$('#sesSakla').checked); ekran='ana'; ciz(); alanlariGetir(); };
}

// ---------- Başlat ----------
(async()=>{
  const t=LS.get('taslak',null); if(t){ aktif=t; ekran='kayit'; }
  try{ kuyrukSayisi=(await DB.hepsi()).length; }catch(e){}
  ciz(); alanlariGetir(); gonder();
  window.addEventListener('online',()=>{ciz();gonder();}); window.addEventListener('offline',ciz);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') gonder(); });
})();
</script></body></html>
